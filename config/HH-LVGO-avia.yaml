common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # LidarToCamera 
  Rcl: [-0.01296, -0.99992, -0.00005, -0.01359, 0.00023, -0.99991, 0.99982, -0.01296, -0.01359]
  Pcl: [0.07404, -0.00242, 0.09286]
  
time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.13
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 6
  blind: 0.8

vio:
  max_iterations: 3
  outlier_threshold: 500 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 6
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: false
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.05 # 0.2
  gyr_cov: 0.03 #0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1
  ba_bg_est_en: true

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.3
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 25
  sliding_thresh: 1

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "Grass01"
  pose_output_en: true

pcd_save:
  pcd_save_en: true
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.1
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

gps:
  gps_en: true
  debug_mode: false
  gps_time_offset: 0.0
  extrinsic_T: [-0.03, 0, 0.17]
  gps_topic: "/receiver_pvt"

opt:
  load_data: false
  rtk_cov: 0.01
  livo2_RPY_cov: 0.00000001
  livo2_XYZ_cov: 0.003
  trim_start_sec: 15.0
  trim_end_sec: 8.0

# Direct dataset output for Global-LVBA.
global_lvba:
  output_en: true
  sequence_name: "avia_test01"

